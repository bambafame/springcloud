spring:
  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${random.value}


management:
  endpoints:
    web:
      exposure:
        include: "health, info, tracing, metrics"
  tracing:
    sampling:
      probability: 1.0 # 100% of traces captured
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
